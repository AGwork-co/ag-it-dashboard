name: Build & Deploy Dashboard

on:
  schedule:
    # 13/17/21 UTC ≈ 7/11/3 AM CST (8/12/4 AM CDT)
    - cron: '0 13,17,21 * * 1-5'
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore:
      # Safety: ignore if generated paths ever reappear
      - 'docs/index.html'
      - 'cache/**'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Restore sprint/burndown cache
        uses: actions/cache@v4
        with:
          path: cache
          key: ado-dashboard-cache-${{ github.run_id }}
          restore-keys: |
            ado-dashboard-cache-

      - name: Install dependencies
        run: npm install

      - name: Fix template placeholder
        run: |
          sed -i 's|/\*__PROJECT_DATA__\*/\[\]|/*__PROJECT_DATA__*/|' template.html
          sed -i 's|/\*__SUPPORT_DATA__\*/{}|/*__SUPPORT_DATA__*/|' template.html

      - name: Build dashboard
        env:
          AZURE_DEVOPS_PAT: ${{ secrets.AZURE_DEVOPS_PAT }}
          AZURE_DEVOPS_ORG_URL: ${{ secrets.AZURE_DEVOPS_ORG_URL }}
          REFRESH_WORKER_URL: ${{ secrets.REFRESH_WORKER_URL }}
        run: npm run build

      - name: Save sprint/burndown cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: cache
          key: ado-dashboard-cache-${{ github.run_id }}

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
